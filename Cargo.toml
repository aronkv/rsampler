[package]
name = "rsampler"
version = "0.12.0"
edition = "2024"
description = "Akai MPC2000XL-inspired sampler desktop app"
license = "Apache-2.0"
repository = "https://github.com/aronkv/rsampler"
readme = "README.md"
keywords = ["sampler", "mpc", "gui", "audio", "music"]
categories = ["multimedia::audio"]

[dependencies]
cpal = "0.18.2"
eframe = "0.37.0"
hound = "3.5.1"
midir = "0.11.1"
opus-pure = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
strip = true
