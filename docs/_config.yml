title: rsampler
description: A desktop sampler inspired by the Akai MPC2000XL, written in pure Rust.
url: https://aronkv.github.io
baseurl: /rsampler
remote_theme: just-the-docs/just-the-docs@v0.12.0
defaults:
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

color_scheme: rsampler
logo: /assets/rsampler.svg
search_enabled: true
heading_anchors: true
enable_copy_code_button: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  GitHub: https://github.com/aronkv/rsampler
  Download: https://github.com/aronkv/rsampler/releases/latest
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/aronkv/rsampler
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

callouts:
  tip:
    title: Tip
    color: green
  note:
    title: Note
    color: blue
  mpc:
    title: On the MPC
    color: yellow

footer_content: >-
  rsampler is distributed under the <a href="https://github.com/aronkv/rsampler/blob/main/LICENSE">Apache License 2.0</a>.
  MPC® and Akai Professional® are registered trademarks of inMusic Brands, Inc.; this project is not affiliated with them.
