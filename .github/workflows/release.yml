name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    # Oldest supported runner, so the binary runs on distros with an older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          asset=rsampler-x86_64-unknown-linux-gnu.tar.gz
          tar -czf "$asset" -C target/release rsampler
          sha256sum "$asset" > "$asset.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes rsampler-*.tar.gz*
